apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-topology-scheduler-config
  namespace: kube-system
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: false
    profiles:
      - schedulerName: gpu-topology-scheduler
        plugins:
          score:
            enabled:
              - name: GpuTopology
                weight: 10
        pluginConfig:
          - name: GpuTopology
            args:
              apiVersion: kubescheduler.config.k8s.io/v1
              kind: GpuTopologyArgs
              scoreSameNode: 100
              scoreSameNVLinkDomain: 80
              scoreSameRack: 50
              scoreDifferentRack: 10
